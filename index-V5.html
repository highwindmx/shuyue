<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数音盒 V5 · 数学内核 / 乐器音色 / 循环织体</title>
<style>
:root{
  --bg:#f6f6f3; --card:#fff; --line:#e4e2db; --ink:#2c2c2a; --muted:#6d6c65;
  --accent:#4f46b5; --soft:#eeecfb; --danger:#a32d2d; --red:#d0574b;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:12px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;overflow:hidden}
button,input,select{font-family:inherit}

/* 顶部：两行控制条 */
.tbar{flex:none;background:#fff;border-bottom:1px solid var(--line);padding:6px 10px 5px;
  display:flex;flex-direction:column;gap:5px;box-shadow:0 2px 10px rgba(30,28,20,.05);z-index:20}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ttl{font-size:13px;font-weight:600;letter-spacing:.3px;white-space:nowrap;margin-right:2px}
.ttl span{font-size:10px;font-weight:400;color:var(--muted);margin-left:5px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;
  height:27px;padding:0 9px;font-size:11.5px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.on{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff;min-width:78px;font-weight:500}
.btn.main:hover{color:#fff;opacity:.88}
.sep{width:1px;height:19px;background:var(--line);margin:0 2px}
.f{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);white-space:nowrap}
.f input[type=range]{width:64px;accent-color:var(--accent);height:16px}
.f b{color:var(--accent);font-variant-numeric:tabular-nums;min-width:26px;font-weight:500}
select.s{font-size:11px;padding:3px 5px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);height:25px}
.spacer{flex:1}
.combo{border:1px solid #dcd8f5;background:var(--soft);color:var(--accent);border-radius:6px;
  padding:3px 8px;font-size:11px;cursor:pointer;white-space:nowrap}
.combo:hover{border-color:var(--accent)}
kbd{background:#efede6;border:1px solid var(--line);border-radius:4px;padding:0 3px;font:10px ui-monospace,monospace}

/* 全局时间轴 */
#timeline{width:100%;height:26px;display:block;flex:none;background:#fff;border-bottom:1px solid var(--line)}

/* 音轨区 */
#tracks{flex:1 1 0;min-height:0;overflow-y:auto;display:flex;flex-direction:column;
  gap:6px;padding:7px 10px}
.track{flex:1 1 0;min-height:112px;display:flex;flex-direction:column;
  background:var(--card);border:1px solid var(--line);border-left:3px solid var(--tc);
  border-radius:9px;overflow:hidden}
.track.active{box-shadow:0 0 0 2px color-mix(in srgb,var(--tc) 16%,transparent)}
.track.off{opacity:.48}
.bar{flex:none;padding:4px 7px 3px;display:flex;flex-direction:column;gap:3px;
  background:linear-gradient(#fff,#fcfcfa);border-bottom:1px solid var(--line)}
.l1{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.grp{display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-width:0}
/* 非数学调节钮统一起靠右，用虚线分隔数学区与演奏区 */
.grp.r{margin-left:auto;justify-content:flex-end;padding-left:8px;border-left:1px dashed #d9d6cc}
select[data-f="timbre"]{max-width:122px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--tc);flex:none}
.nm{font-size:11px;font-weight:600;color:var(--tc);min-width:30px;white-space:nowrap}
.chk{accent-color:var(--tc);width:13px;height:13px;flex:none;margin:0}
select.psel{font-size:11px;padding:2px 4px;border:1px solid var(--line);border-radius:6px;
  background:#fff;color:var(--ink);height:23px;max-width:174px}
input.ex{height:23px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;
  font:11px/1.4 ui-monospace,Consolas,monospace;background:#fff;color:var(--ink);outline:none;min-width:120px}
input.ex:focus{border-color:var(--tc)}
input.ex.ro{background:#f7f7f4;color:#55544f}
input.num{height:23px;width:52px;border:1px solid var(--line);border-radius:6px;padding:2px 5px;
  font:11px ui-monospace,monospace;background:#fff;color:var(--ink)}
.mini{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:5px;
  width:21px;height:21px;font-size:10px;cursor:pointer;flex:none;padding:0}
.mini:hover{border-color:var(--tc);color:var(--tc)}
.mini.on{background:var(--tc);border-color:var(--tc);color:#fff}
.tag{font-size:10px;color:var(--muted);white-space:nowrap}
.l2{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.slgrp{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}
.sl{display:flex;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);white-space:nowrap}
.sl input[type=range]{width:60px;accent-color:var(--tc);height:14px}
.sl b{font-size:10.5px;color:var(--tc);font-weight:500;min-width:26px;text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:10.5px;color:#8b8a83;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 110px;text-align:left;min-width:0}
.trerr{font-size:10.5px;color:var(--danger);padding:0 8px 2px}
canvas.lane{flex:1 1 0;min-height:46px;width:100%;display:block;background:#fdfdfb}

/* 底部状态 */
.foot{flex:none;height:25px;display:flex;align-items:center;gap:14px;padding:0 11px;
  border-top:1px solid var(--line);background:#fff;font-size:10.5px;color:var(--muted);
  font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap}
.foot b{color:var(--ink);font-weight:500}
#sNote{flex:1;overflow:hidden;text-overflow:ellipsis;color:#8b8a83;text-align:right}
@media(max-width:1000px){.f input[type=range]{width:48px}.sl input[type=range]{width:44px}.note{display:none}}
</style>
</head>
<body>

<div class="tbar">
  <div class="row">
    <div class="ttl">数音盒<span>V5 · 数学内核 / 乐器音色 / 循环织体</span></div>
    <button class="btn main" id="playBtn">▶ 播放</button>
    <button class="btn" id="stopBtn">■ 停止</button>
    <button class="btn on" id="loopBtn" title="默认开启；L 键切换">↻ 循环</button>
    <button class="btn" id="revBtn">◀ 倒放</button>
    <button class="btn" id="invBtn">⇅ 倒影</button>
    <div class="sep"></div>
    <label class="f">BPM <input type="range" id="bpm" min="50" max="240" value="120"><b id="bpmV">120</b></label>
    <label class="f">步数 <input type="range" id="steps" min="8" max="64" value="32"><b id="stepsV">32</b></label>
    <label class="f">音量 <input type="range" id="master" min="0" max="1" step="0.01" value="0.8"><b id="masterV">0.80</b></label>
    <label class="f">根音 <select class="s" id="root"><option value="48">C3</option><option value="55">G3</option><option value="60" selected>C4</option><option value="62">D4</option><option value="65">F4</option><option value="69">A4</option></select></label>
    <label class="f">八度 <select class="s" id="octaves"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option></select></label>
  </div>
  <div class="row">
    <span class="tag">一键组合</span>
    <span id="combos" style="display:flex;gap:5px;flex-wrap:wrap"></span>
    <div class="spacer"></div>
    <button class="btn" id="addBtn">＋ 音轨</button>
    <button class="btn" id="wavBtn">导出 WAV</button>
    <button class="btn" id="midiBtn">导出 MIDI</button>
    <span class="tag" style="margin-left:4px"><kbd>空格</kbd> 播放/暂停 · <kbd>L</kbd> 循环 · <kbd>R</kbd> 倒放 · <kbd>I</kbd> 倒影 · <kbd>S</kbd> 停止 · <kbd>A</kbd> 加轨</span>
  </div>
</div>

<canvas id="timeline"></canvas>
<div id="tracks"></div>

<div class="foot">
  <span>音轨 <b id="sTracks">0</b></span>
  <span>音符 <b id="sCount">0</b></span>
  <span>一轮 <b id="sDur">0.0 s</b></span>
  <span>播放头 <b id="sHead">—</b></span>
  <span>状态 <b id="sState">停止</b></span>
  <span id="sErr" style="color:#a32d2d"></span>
  <span id="sNote">选中一条音轨，这里显示它的数学出处</span>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const clampMidi = m => Math.max(36, Math.min(96, Math.round(m)));
const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const noteName = m => NAMES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---------- 数学：π 与数论 ---------- */
function atanInvSeries(k, scale){
  const kk = BigInt(k), k2 = kk * kk;
  let term = scale / kk, sum = 0n, sign = 1n, denom = 1n;
  while (term !== 0n){ sum += sign * (term / denom); term = term / k2; denom += 2n; sign = -sign; }
  return sum;
}
function computePiDigits(digits){
  const scale = 10n ** BigInt(digits + 12);
  const pi = 4n * (4n * atanInvSeries(5, scale) - atanInvSeries(239, scale));
  return (pi % scale).toString().padStart(digits + 12, '0').slice(0, digits);
}
const PI_DIGITS = computePiDigits(300);
function isPrime(k){
  k = Math.floor(Math.abs(k)); if (k < 2) return false; if (k % 2 === 0) return k === 2;
  for (let d = 3; d * d <= k; d += 2) if (k % d === 0) return false; return true;
}
function nthPrime(n){
  n = Math.max(0, Math.floor(n)); const ps = []; let k = 2;
  while (ps.length <= n){ if (isPrime(k)) ps.push(k); k++; } return ps[n];
}
function fibmod(n, m){
  m = Math.max(1, Math.floor(m)); let a = 0, b = 1 % m;
  for (let i = 0; i < Math.max(0, Math.floor(n)); i++){ const c = (a + b) % m; a = b; b = c; } return a;
}
function popcount(n){ n = Math.floor(Math.abs(n)); let c = 0; while (n > 0){ c += n & 1; n = Math.floor(n / 2); } return c; }
function collatz(n){ n = Math.max(1, Math.floor(Math.abs(n))); let c = 0; while (n !== 1 && c < 2000){ n = n % 2 ? 3 * n + 1 : n / 2; c++; } return c; }
const FUNCS = {
  sin:Math.sin, cos:Math.cos, tan:Math.tan,
  asin:Math.asin, acos:Math.acos, atan:Math.atan, atan2:Math.atan2,
  floor:Math.floor, ceil:Math.ceil, round:Math.round, abs:Math.abs, sqrt:Math.sqrt,
  log:Math.log, exp:Math.exp, sign:Math.sign, pow:Math.pow, min:Math.min, max:Math.max,
  mod:(a,b)=> b===0?0:((a%b)+b)%b, frac:x=>x-Math.floor(x),
  gcd:(a,b)=>{a=Math.abs(Math.round(a));b=Math.abs(Math.round(b));while(b){const t=a%b;a=b;b=t;}return a;},
  fibmod, prime:nthPrime, isprime:n=>isPrime(n)?1:0, popcount, collatz,
  pidigit:n=>Number(PI_DIGITS[Math.floor(Math.abs(n)) % PI_DIGITS.length])
};

/* ---------- 公式解析：tokenize → Pratt AST → 求值（不用 eval） ---------- */
function tokenize(src){
  const re = /\s*([0-9]+(?:\.[0-9]+)?(?:[eE][+-]?[0-9]+)?|[A-Za-z_][A-Za-z_0-9]*|\*\*|[+\-*/%^(),])/gy;
  const out = []; let pos = 0;
  while (pos < src.length){
    re.lastIndex = pos; const m = re.exec(src);
    if (!m) throw new Error('无法识别的字符：' + src.slice(pos, pos + 12));
    out.push(m[1] === '**' ? '^' : m[1]); pos = re.lastIndex;
  } return out;
}
const BP = { '+':10, '-':10, '*':20, '/':20, '%':20, '^':30 };
function parse(tokens){
  let i = 0; const peek = () => tokens[i], eat = () => tokens[i++];
  function expr(minBp){
    let lhs = prefix();
    while (true){ const op = peek(); if (!op || !(op in BP) || BP[op] < minBp) break;
      eat(); const rhs = expr(op === '^' ? BP[op] : BP[op] + 1); lhs = { t:'bin', op, lhs, rhs }; }
    return lhs;
  }
  function prefix(){
    const t = eat();
    if (t === undefined) throw new Error('公式不完整');
    if (t === '-') return { t:'un', a:expr(25) };
    if (t === '+') return expr(25);
    if (t === '('){ const e = expr(0); if (eat() !== ')') throw new Error('缺少右括号 )'); return e; }
    if (/^[0-9]/.test(t)) return { t:'num', v:parseFloat(t) };
    if (/^[A-Za-z_]/.test(t)){
      if (peek() === '('){ eat(); const args = [];
        if (peek() !== ')'){ args.push(expr(0)); while (peek() === ','){ eat(); args.push(expr(0)); } }
        if (eat() !== ')') throw new Error('函数缺少右括号 )');
        return { t:'call', name:t, args }; }
      return { t:'var', name:t };
    }
    throw new Error('意外的符号：' + t);
  }
  const ast = expr(0);
  if (i < tokens.length) throw new Error('多余的符号：' + tokens.slice(i).join(' '));
  return ast;
}
function evalNode(node, env){
  switch (node.t){
    case 'num': return node.v;
    case 'var': { const v = env[node.name]; if (v === undefined) throw new Error('未知变量：' + node.name); return v; }
    case 'un': return -evalNode(node.a, env);
    case 'bin': { const a = evalNode(node.lhs, env), b = evalNode(node.rhs, env);
      switch (node.op){ case '+':return a+b; case '-':return a-b; case '*':return a*b;
        case '/':return b===0?0:a/b; case '%':return b===0?0:a%b; case '^':return Math.pow(a,b); } return 0; }
    case 'call': { const f = FUNCS[node.name]; if (!f) throw new Error('未知函数：' + node.name);
      return f(...node.args.map(a => evalNode(a, env))); }
  } return 0;
}
function evalAt(ast, n, steps, x){
  const env = { n, t:n/steps, x, PI:Math.PI, E:Math.E, PHI:(1+Math.sqrt(5))/2, TAU:2*Math.PI };
  const v = evalNode(ast, env); return Number.isFinite(v) ? v : 0;
}
function buildRaw(ast, steps){
  const out = []; let x = 0.5;
  for (let n = 0; n < steps; n++){ x = evalAt(ast, n, steps, x); out.push(x); }
  return out;
}
/* 不含递推变量 x 的公式，可以直接在连续时间轴上密集采样，画出真正的 f(t) */
function usesX(node){
  if (!node || typeof node !== 'object') return false;
  if (node.t === 'var') return node.name === 'x';
  if (node.t === 'bin') return usesX(node.lhs) || usesX(node.rhs);
  if (node.t === 'un') return usesX(node.a);
  if (node.t === 'call') return node.args.some(usesX);
  return false;
}
function denseRaw(ast, steps){
  const out = [];
  for (let k = 0; k <= steps * 8; k++) out.push(evalAt(ast, k / 8, steps, 0.5));
  return out;
}

/* ---------- 细胞自动机：一维三邻域 Wolfram 规则 ---------- */
function caSeedRow(w, mode, salt){
  const r = new Uint8Array(w);
  if (mode === 'pair'){
    r[(Math.floor(w/3) + salt) % w] = 1; r[(Math.floor(2*w/3) + salt) % w] = 1;
  } else if (mode === 'random'){
    let st = (2463534242 + salt * 7919) >>> 0;
    for (let i = 0; i < w; i++){ st = (st * 1664525 + 1013904223) >>> 0; r[i] = (st >>> 16) & 1; }
  } else r[(Math.floor(w/2) + salt) % w] = 1;
  return r;
}
function caGenerate(rule, width, steps, seedMode){
  const w = Math.max(8, Math.min(64, Math.round(width)));
  const R = Math.max(0, Math.min(255, Math.round(rule)));
  let row = caSeedRow(w, seedMode, 0), restart = 0;
  const grid = [], raw = [];
  for (let s = 0; s < steps; s++){
    grid.push(Array.from(row));
    let cnt = 0, sum = 0, wsum = 0;
    for (let i = 0; i < w; i++) if (row[i]){ cnt++; sum += i; wsum += i * ((i % 5) + 1); }
    raw.push((sum + 0.7*cnt + 0.13*wsum) / w);
    const next = new Uint8Array(w);
    for (let i = 0; i < w; i++){
      const idx = (row[(i - 1 + w) % w] << 2) | (row[i] << 1) | row[(i + 1) % w];
      next[i] = (R >> idx) & 1;
    }
    /* 有限宽环形网格下，线性规则（90/150）会全灭、某些规则会落入不动点；
       此时重新播种，让演化分成一个个乐句而不是后面全是单音 */
    const dead = !next.some(v => v);
    const fixed = next.every((v, i) => v === row[i]);
    row = (dead || fixed) ? caSeedRow(w, seedMode, ++restart) : next;
  }
  return { raw, grid, width:w, restarts:restart };
}
/* ---------- 二维细胞自动机：每步网格 → 一个和弦 ---------- */
const CA2_RULES = [
  {id:'life',  name:'生命游戏 B3/S23'},
  {id:'brain', name:"Brian's Brain 三态"},
  {id:'seeds', name:'Seeds B2 爆发'},
  {id:'daynight', name:'Day & Night B3678/S34678'}
];
const DN_SURVIVE = new Set([3,4,6,7,8]), DN_BORN = new Set([3,6,7,8]);
function ca2Sig(g, S){
  let s = '';
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) s += g[y][x];
  return s;
}
function ca2Seed(S, rule, salt){
  const g = Array.from({ length:S }, () => new Uint8Array(S));
  let st = (1013904223 + salt * 2654435761) >>> 0;
  const rnd = () => { st = (st * 1664525 + 1013904223) >>> 0; return (st >>> 16) / 65536; };
  const c = Math.floor(S/2);
  for (let y = 1; y < S-1; y++) for (let x = 1; x < S-1; x++){
    const d = Math.abs(x-c) + Math.abs(y-c);
    if (d < S*.8 && rnd() < .34) g[y][x] = 1;
  }
  return g;
}
function ca2Step(g, rule, S){
  const out = Array.from({ length:S }, () => new Uint8Array(S));
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++){
    let n = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){
      if (!dx && !dy) continue;
      const v = g[(y+dy+S)%S][(x+dx+S)%S];
      if (rule === 'brain' ? v === 1 : v > 0) n++;
    }
    const cur = g[y][x];
    if (rule === 'life')       out[y][x] = (cur ? (n===2||n===3) : (n===3)) ? 1 : 0;
    else if (rule === 'brain') out[y][x] = cur === 1 ? 2 : (cur === 2 ? 0 : (n === 2 ? 1 : 0));
    else if (rule === 'seeds') out[y][x] = cur ? 0 : (n === 2 ? 1 : 0);
    else if (rule === 'daynight') out[y][x] = (cur ? DN_SURVIVE.has(n) : DN_BORN.has(n)) ? 1 : 0;
    else                       out[y][x] = n >= 5 ? 1 : 0;
  }
  return out;
}
function ca2Generate(rule, size, steps, voices){
  const S = Math.max(6, Math.min(16, Math.round(size)));
  const V = Math.max(1, Math.min(6, Math.round(voices)));
  let g = ca2Seed(S, rule, 0), restart = 0;
  const snaps = [], raw = [], chords = [], seen = new Set();
  for (let s = 0; s < steps; s++){
    snaps.push(g);
    const byY = new Map();
    let live = 0;
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++){
      const v = g[y][x];
      if (rule === 'brain' ? v === 1 : v > 0){
        live++;
        const a = byY.get(y) || { n:0, sx:0 }; a.n++; a.sx += x; byY.set(y, a);
      }
    }
    raw.push(live);
    /* 密度直接决定织体厚度：细胞稀疏时只剩一两个声部，密集时铺满和弦 */
    const cap = Math.max(1, Math.min(V, Math.round(V * live / (S*1.5))));
    const rows = [...byY.entries()].sort((a,b) => b[1].n - a[1].n || a[0] - b[0]).slice(0, cap);
    const dens = live / (S*S);
    chords.push(rows.map(([y, a]) => ({
      h: y / (S-1),
      pan: (a.sx/a.n/(S-1))*2 - 1,
      vel: Math.min(1, .28 + .5*Math.min(1, a.n/S) + .2*dens),
      amp: Math.min(1.15, .6 + .5*Math.min(1, a.n/4))
    })));
    const next = ca2Step(g, rule, S);
    let alive = 0;
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) if (next[y][x]) alive++;
    const sig = ca2Sig(next, S);
    /* 全灭、不动点或落进循环 → 重新播种，把演化切成有呼吸的乐句 */
    if (!alive || seen.has(sig)){ g = ca2Seed(S, rule, ++restart); seen.clear(); }
    else { seen.add(sig); g = next; }
  }
  return { raw, snaps, size:S, chords, restarts:restart };
}

/* ---------- 交叉轨：公式 A 被公式 B 调制 ---------- */
function sampleAt(arr, p){
  const L = arr.length, i0 = Math.floor(p), f = p - i0;
  const a = arr[((i0 % L) + L) % L], b = arr[(((i0 + 1) % L) + L) % L];
  return a + (b - a) * f;
}
const PARAM_MODES = ['amp','panmod','gate','len'];
function xmodGenerate(astA, astB, mode, N){
  const A = buildRaw(astA, N), B = buildRaw(astB, N);
  const mn = Math.min(...B), mx = Math.max(...B), br = (mx - mn) || 1;
  const bn = B.map(v => ((v - mn) / br) * 2 - 1);
  const ar = (Math.max(...A) - Math.min(...A)) || 1;
  let raw, mods = null;
  /* 参数调制：B 完全不碰音高，只逐音符改音量 / 声像 / 时值 / 是否触发 */
  if (PARAM_MODES.includes(mode)){
    raw = A.slice();
    mods = bn.map(v => {
      if (mode === 'amp')    return { amp: .25 + .9*(v+1)/2 };
      if (mode === 'panmod') return { pan: v };
      if (mode === 'len')    return { len: .35 + 1.25*(v+1)/2 };
      return { gate: v > -.25 ? 1 : 0 };
    });
  } else if (mode === 'am')        raw = A.map((a,i) => a * (0.5 + 0.5*bn[i]));
  else if (mode === 'ring')        raw = A.map((a,i) => a * bn[i]);
  else if (mode === 'sub')         raw = A.map((a,i) => a - bn[i]*ar*0.35);
  else if (mode === 'phase')       raw = A.map((a,i) => sampleAt(A, i + bn[i]*3));
  else                             raw = A.map((a,i) => a + bn[i]*ar*0.35);
  return { raw, rawA:A, rawB:B, mods };
}

    eg.gain.exponentialRampToValueAtTime(.0001, when + P.tdec);
    o.connect(eg); eg.connect(g); o.start(when); o.stop(when + P.tdec + .02);
    src.push(o); junk.push(eg);
  }
  if (P.noise){
    const s = ctx.createBufferSource(); s.buffer = noiseBuffer(ctx);
    const eg = ctx.createGain();
    eg.gain.setValueAtTime(Math.max(.0001, a * P.noise), when);
    eg.gain.exponentialRampToValueAtTime(.0001, when + P.ndec);
    let ntail = s;
    if (P.hp || P.bp){
      const fl = ctx.createBiquadFilter();
      fl.type = P.bp ? 'bandpass' : 'highpass'; fl.frequency.value = P.bp || P.hp;
      if (P.q) fl.Q.value = P.q;
      s.connect(fl); ntail = fl; junk.push(fl);
    }
    ntail.connect(eg); eg.connect(g);
    s.start(when, Math.random() * .3); s.stop(when + P.ndec + .02);
    src.push(s); junk.push(eg);
  }
  let left = src.length;
  src.forEach(o => {
    o.onended = () => {
      const i = liveOsc.indexOf(o); if (i >= 0) liveOsc.splice(i, 1);
      if (--left === 0){
        try { junk.forEach(n => n.disconnect()); g.disconnect(); if (pn) pn.disconnect(); } catch (e) {}
      }
    };
    liveOsc.push(o);
  });
}
function spawnVoice(ctx, timbre, freq, when, len, amp, dest, notePan){
  const sp = VOICE_SPEC[timbre] || VOICE_SPEC.triangle;
  if (sp.kind === 'ks'){ spawnKS(ctx, sp, freq, when, amp, dest, notePan); return; }
  const g = ctx.createGain(); let tail = g, lp = null, pn = null;
  if (sp.cut){ lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = sp.cut; g.connect(lp); tail = lp; }
  /* 逐音符声像作为相对偏移，叠在常驻轨声像节点之前 */
  if (notePan && ctx.createStereoPanner){
    pn = ctx.createStereoPanner(); pn.pan.value = Math.max(-1, Math.min(1, notePan));
    tail.connect(pn); pn.connect(dest);
  } else tail.connect(dest);
  const L = Math.max(.055, len);
  const end = sp.decay ? Math.max(.12, sp.decay) : (sp.exp ? Math.max(.12, L * 1.55) : L);
  g.gain.setValueAtTime(.0001, when);
  g.gain.linearRampToValueAtTime(amp, when + Math.min(sp.a, L * .3));
  if (sp.exp) g.gain.exponentialRampToValueAtTime(.0001, when + end);
  else { g.gain.setValueAtTime(amp, when + Math.max(sp.a, L * sp.hold - .01)); g.gain.exponentialRampToValueAtTime(.0001, when + end); }
  const norm = sp.parts.reduce((s, p) => s + p[1], 0);
  sp.parts.forEach(([mult, pa], k) => {
    const o = ctx.createOscillator(); o.type = sp.type; o.frequency.value = freq * mult;
    const pg = ctx.createGain(); pg.gain.value = pa / norm;
    o.connect(pg); pg.connect(g);
    o.start(when); o.stop(when + end + .03);
    o.onended = () => {
      const idx = liveOsc.indexOf(o); if (idx >= 0) liveOsc.splice(idx, 1);
      if (k === sp.parts.length - 1){ try { g.disconnect(); if (lp) lp.disconnect(); if (pn) pn.disconnect(); } catch (e) {} }
    };
    liveOsc.push(o);
  });
}
function makeBus(ctx, vol){
  const bus = ctx.createGain(); bus.gain.value = vol;
  const delay = ctx.createDelay(1.0); delay.delayTime.value = .19;
  const fb = ctx.createGain(); fb.gain.value = .18;
  const wet = ctx.createGain(); wet.gain.value = .18;
  bus.connect(ctx.destination);
  bus.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(ctx.destination);
  return bus;
}
function ensureCtx(){
  if (actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  actx = new AC();
  masterBus = makeBus(actx, Number($('#master').value));
}
function setupTrackNodes(ctx, bus){
  const cache = {};
  tracks.forEach(tr => {
    if (ctx === actx && tr.gainNode){
      tr.gainNode.gain.value = tr.volume;
      if (tr.panNode) tr.panNode.pan.value = tr.pan;
      cache[tr.id] = tr.gainNode;
      return;
    }
    const g = ctx.createGain(); g.gain.value = tr.volume;
    let tail = g;
    if (ctx.createStereoPanner){
      const p = ctx.createStereoPanner(); p.pan.value = tr.pan; g.connect(p); p.connect(bus); tail = p;
    } else g.connect(bus);
    cache[tr.id] = g;
    if (ctx === actx){ tr.gainNode = g; tr.panNode = tail === g ? null : tail; }
  });
  return cache;
}
function renderRound(ctx, destFor, startAt){
  const dur = stepDur(), N = stepsN();
  tracks.forEach(tr => {
    if (!audible(tr)) return;
    const dest = destFor(tr); if (!dest) return;
    displayNotes(tr).forEach((chord, i) => {
      const shifted = ((i + tr.offset) % N + N) % N;
      const when = startAt + shifted * dur;
      /* 和弦等功率归一，避免四声部同时响时削波 */
      const norm = 1 / Math.sqrt(Math.max(1, chord.length));
      chord.forEach(nt => {
        const len = Math.max(.04, dur * tr.gate * (nt.len ?? 1));
        const amp = nt.vel * (nt.amp ?? 1) * norm * .22;
        if (isPerc(tr.timbre)) spawnPerc(ctx, drumOf(tr.timbre, nt), when, amp, dest, nt.pan);
        else spawnVoice(ctx, tr.timbre, freqOf(nt.midi), when, len, amp, dest, nt.pan);
      });
    });
  });
}
function stopVoices(){
  const list = liveOsc.slice(); liveOsc = [];
  list.forEach(o => { try { o.stop(0); } catch (e) {} });
}
function ensureScheduled(){
  if (!playing || paused || !actx) return;
  const horizon = actx.currentTime + .6;
  if (!loop){ if (!roundScheduled){ renderRound(actx, tr => tr.gainNode, nextRoundAt); roundScheduled = true; } return; }
  while (nextRoundAt < horizon){ renderRound(actx, tr => tr.gainNode, nextRoundAt); nextRoundAt += roundDur(); }
}
function tick(){
  if (!playing || !actx) return;
  const elapsed = actx.currentTime - roundStart;
  if (!loop && elapsed >= roundDur() + .18){ stop(); return; }
  const idx = Math.max(0, Math.floor(elapsed / stepDur()) % stepsN());
  if (idx !== playhead){ playhead = idx; draw(); updateStatus(); }
  rafId = requestAnimationFrame(tick);
}
function play(){
  ensureCtx();
  if (actx.state === 'suspended') actx.resume();
  if (playing) stopVoices();
  setupTrackNodes(actx, masterBus);
  playing = true; paused = false; playhead = -1;
  roundStart = actx.currentTime + .06; nextRoundAt = roundStart; roundScheduled = false;
  liveOsc = [];
  ensureScheduled();
  clearInterval(schedTimer); schedTimer = setInterval(ensureScheduled, 70);
  cancelAnimationFrame(rafId); rafId = requestAnimationFrame(tick);
  syncTransport();
}
function pauseToggle(){
  if (!playing){ play(); return; }
  if (paused){ actx.resume(); paused = false; }
  else { actx.suspend(); paused = true; }
  syncTransport(); updateStatus();
}
function stop(){
  playing = false; paused = false; playhead = -1;
  stopVoices(); clearInterval(schedTimer); cancelAnimationFrame(rafId);
  schedTimer = null; rafId = null;
  syncTransport(); draw(); updateStatus();
}
function syncTransport(){
  $('#playBtn').textContent = playing ? (paused ? '▶ 继续' : '⏸ 暂停') : '▶ 播放';
  $('#loopBtn').classList.toggle('on', loop);
  $('#revBtn').classList.toggle('on', globalReverse);
  $('#invBtn').classList.toggle('on', globalInvert);
}

/* ---------- 导出 ---------- */
function download(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
function encodeWavStereo(buf){
  const L = buf.getChannelData(0), R = buf.numberOfChannels > 1 ? buf.getChannelData(1) : L;
  const n = L.length, ab = new ArrayBuffer(44 + n * 4), dv = new DataView(ab);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  ws(0,'RIFF'); dv.setUint32(4, 36 + n * 4, true); ws(8,'WAVE'); ws(12,'fmt ');
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,2,true);
  dv.setUint32(24,buf.sampleRate,true); dv.setUint32(28,buf.sampleRate*4,true);
  dv.setUint16(32,4,true); dv.setUint16(34,16,true);
  ws(36,'data'); dv.setUint32(40,n*4,true);
  let o = 44;
  for (let i = 0; i < n; i++){
    const a = Math.max(-1, Math.min(1, L[i])), b = Math.max(-1, Math.min(1, R[i]));
    dv.setInt16(o, a < 0 ? a * 0x8000 : a * 0x7FFF, true); o += 2;
    dv.setInt16(o, b < 0 ? b * 0x8000 : b * 0x7FFF, true); o += 2;
  }
  return ab;
}
async function exportWav(){
  const total = roundDur() + 1.4;
  const off = new OfflineAudioContext(2, Math.ceil(44100 * total), 44100);
  const bus = makeBus(off, Number($('#master').value));
  const cache = setupTrackNodes(off, bus);
  const saved = liveOsc; liveOsc = [];
  renderRound(off, tr => cache[tr.id], .02);
  liveOsc = saved;
  const buf = await off.startRendering();
  download(new Blob([encodeWavStereo(buf)], { type:'audio/wav' }), 'mathscore-v5.wav');
}
function vlq(v){ const b = [v & 0x7f]; while ((v >>= 7)) b.unshift((v & 0x7f) | 0x80); return b; }
function midiChunk(head, bytes){
  const len = bytes.length;
  return [...head, (len>>>24)&255, (len>>>16)&255, (len>>>8)&255, len&255, ...bytes];
}
function exportMidi(){
  const TPQ = 480, TPS = 240, N = stepsN(), bpm = Number($('#bpm').value);
  const us = Math.round(60000000 / bpm);
  const tempo = [0x00,0xFF,0x51,0x03,(us>>>16)&255,(us>>>8)&255,us&255, 0x00,0xFF,0x2F,0x00];
  const chunks = [midiChunk([0x4D,0x54,0x72,0x6B], tempo)];
  tracks.filter(audible).forEach(tr => {
    const drum = isPerc(tr.timbre), ch = drum ? 9 : 0;
    const ON = 0x90 | ch, OFF = 0x80 | ch, CC = 0xB0 | ch;
    const nameBytes = Array.from(new TextEncoder().encode(tr.name + (drum ? ' · 鼓 ' : ' · ') + label(tr).slice(0,40)));
    const ev = [];
    const push = (t, d) => ev.push({ t, d });
    push(0, [0x00,0xFF,0x03,...vlq(nameBytes.length),...nameBytes]);
    push(0, [0x00,CC,0x0A,Math.round((tr.pan+1)*63.5)]);
    push(0, [0x00,CC,0x07,Math.round(tr.volume*100)]);
    displayNotes(tr).forEach((chord,i) => {
      const shifted = ((i + tr.offset) % N + N) % N;
      const t0 = shifted*TPS;
      chord.forEach(nt => {
        const vel = Math.max(1, Math.min(127, Math.round(nt.vel*(nt.amp ?? 1)*100)));
        const key = drum ? (PERC_GM[drumOf(tr.timbre, nt)] || 38) : nt.midi;
        const offT = drum ? t0 + 12 : t0 + Math.max(8, TPS*tr.gate*(nt.len ?? 1) - 8);
        push(t0, [ON, key, vel]);
        push(offT, [OFF, key, 0]);
      });
    });
    ev.push({ t:N*TPS, d:[0x00,0xFF,0x2F,0x00] });
    ev.sort((a,b) => a.t-b.t || ((a.d[0] & 0xF0) === 0x80 ? -1 : 1));
    const bytes = []; let last = 0;
    for (const e of ev){ bytes.push(...vlq(e.t - last), ...e.d); last = e.t; }
    chunks.push(midiChunk([0x4D,0x54,0x72,0x6B], bytes));
  });
  const nt = chunks.length;
  const header = [0x4D,0x54,0x68,0x64, 0,0,0,6, 0,1, (nt>>>8)&255, nt&255, (TPQ>>>8)&255, TPQ&255];
  const all = [].concat(header, ...chunks);
  download(new Blob([new Uint8Array(all)], { type:'audio/midi' }), 'mathscore-v5.mid');
}

  $('#'+id).addEventListener('input', () => {
    $('#bpmV').textContent = $('#bpm').value;
    $('#stepsV').textContent = $('#steps').value;
    $('#masterV').textContent = Number($('#master').value).toFixed(2);
    if (id === 'master'){ if (masterBus) masterBus.gain.value = Number($('#master').value); updateStatus(); }
    else scheduleRegen();
  });
});
['root','octaves'].forEach(id => $('#'+id).addEventListener('change', () => regen(true)));
$('#playBtn').addEventListener('click', pauseToggle);
$('#stopBtn').addEventListener('click', stop);
$('#loopBtn').addEventListener('click', () => { loop = !loop; if (playing){ stop(); play(); } else syncTransport(); });
$('#revBtn').addEventListener('click', () => { globalReverse = !globalReverse; syncTransport(); regen(true); });
$('#invBtn').addEventListener('click', () => { globalInvert = !globalInvert; syncTransport(); regen(true); });
$('#addBtn').addEventListener('click', () => addTrack());
$('#wavBtn').addEventListener('click', () => exportWav().catch(e => { $('#sErr').textContent = '导出失败：' + e.message; }));
$('#midiBtn').addEventListener('click', exportMidi);
document.addEventListener('keydown', e => {
  if (['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (e.code === 'Space'){ e.preventDefault(); pauseToggle(); }
  else if (k === 'l') $('#loopBtn').click();
  else if (k === 'r') $('#revBtn').click();
  else if (k === 'i') $('#invBtn').click();
  else if (k === 's') stop();
  else if (k === 'a') addTrack();
});
window.addEventListener('resize', draw);
if (window.ResizeObserver){ new ResizeObserver(() => draw()).observe($('#tracks')); }

renderCombos(); loadCombo(0); syncTransport();
</script>
</body>
</html>
